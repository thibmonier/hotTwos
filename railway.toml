# US-008 / ADR-13 — déploiement staging (Railway, zone UE, sans données réelles).
# Build via le Dockerfile (image FrankenPHP), healthcheck sur /health.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Applique les migrations avant que le nouveau déploiement ne serve du trafic (US-008 /
# TECH-1). Idempotent ; --allow-no-migration évite l'échec quand rien n'est en attente.
preDeployCommand = "php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Variables à définir dans le service Railway (jamais commitées — ARC-88) :
#   APP_ENV=staging
#   APP_SECRET=<généré>
#   DATABASE_URL=<référence au service PostgreSQL Railway>
#   SERVER_NAME=:${PORT}    # FrankenPHP écoute sur le port fourni par Railway
