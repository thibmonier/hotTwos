<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Outfit", system-ui, -apple-system, sans-serif; color: #344054; }
    a { color: #465fff; text-decoration: none; } a:hover { color: #3641d9; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #465fff; outline-offset: 2px; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#f9fafb; display:flex; flex-direction:column; font-size:14px; line-height:1.5;">

  <header style="height:56px; flex-shrink:0; background:#fff; border-bottom:1px solid #e4e7ec; display:flex; align-items:center; justify-content:space-between; padding:0 16px;">
    <button type="button" aria-label="Menu" style="width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; border:none; background:none; color:#344054; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span style="font-weight:600; color:#101828;">Saisie du jour</span>
    <span style="width:32px; height:32px; border-radius:9999px; background:#ecf3ff; color:#465fff; display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:12px;">CM</span>
  </header>

  <div style="flex:1; overflow:auto; padding:16px;">

    <!-- Navigation jour -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <a href="#" aria-label="Jour précédent" style="width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #e4e7ec; border-radius:8px; color:#344054;">←</a>
      <span style="font-weight:600; color:#101828;">Aujourd'hui · Mer 10 sept.</span>
      <a href="#" aria-label="Jour suivant" style="width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #e4e7ec; border-radius:8px; color:#344054;">→</a>
    </div>

    <!-- Objectif du jour (reco TMP2-03) + total serveur (reco TMP2-02) -->
    <div style="background:#fff; border:1px solid #e4e7ec; border-radius:12px; padding:14px 16px; margin-bottom:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:12px; color:#667085;">Total du jour</span>
        <span style="font-weight:700; color:#101828;">10,5 h <span style="font-weight:400; color:#667085;">/ 7 h attendues</span></span>
      </div>
      <div style="height:8px; background:#eaecf0; border-radius:9999px; overflow:hidden;"><span style="display:block; height:100%; width:100%; background:#12b76a; border-radius:9999px;"></span></div>
    </div>

    <!-- Bannière hors-ligne (atout TMP2-01) -->
    <div role="status" style="display:flex; align-items:center; gap:8px; background:#fffaeb; border:1px solid #fedf89; border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:12px; color:#b54708;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M1 1l22 22M16.7 16.7A8 8 0 0 1 5 12M8.5 8.5A8 8 0 0 1 19 12"/></svg>
      Pas de connexion — vos saisies sont conservées sur cet appareil.
    </div>
    <div role="status" style="display:flex; align-items:center; justify-content:space-between; gap:8px; background:#eff8ff; border:1px solid #b2ddff; border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:12px; color:#1849a9;">
      <span style="display:flex; align-items:center; gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        Saisies en attente de synchronisation.
      </span>
      <button type="button" style="border:none; background:none; color:#1849a9; font-weight:600; cursor:pointer; padding:0;">Resynchroniser</button>
    </div>

    <!-- Reprendre la veille -->
    <button type="button" style="width:100%; min-height:44px; border:1px solid #d0d5dd; border-radius:10px; background:#fff; color:#344054; font-weight:600; cursor:pointer; margin-bottom:16px;">Reprendre la saisie de la veille</button>

    <!-- Cartes projet -->
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div style="background:#fff; border:1px solid #e4e7ec; border-radius:12px; padding:14px 16px;">
        <div style="font-weight:600; color:#101828; margin-bottom:10px;">Projet Boréal <span style="font-weight:400; color:#667085; font-size:12px;">BOR-114</span></div>
        <label style="display:block; font-size:12px; font-weight:500; color:#475467; margin-bottom:4px;">Durée (heures)</label>
        <input type="number" value="3.5" style="width:120px; height:48px; text-align:center; border:1px solid #d0d5dd; border-radius:10px; font-size:16px; color:#101828; margin-bottom:12px;">
        <label style="display:block; font-size:12px; font-weight:500; color:#475467; margin-bottom:4px;">Commentaire (optionnel)</label>
        <textarea rows="2" style="width:100%; border:1px solid #d0d5dd; border-radius:10px; font-size:14px; color:#101828; padding:10px 12px; resize:vertical; font-family:inherit;">Atelier de cadrage delivery avec le client.</textarea>
      </div>
      <div style="background:#fff; border:1px solid #e4e7ec; border-radius:12px; padding:14px 16px;">
        <div style="font-weight:600; color:#101828; margin-bottom:10px;">Congés <span style="font-weight:400; color:#667085; font-size:12px;">Absence</span></div>
        <label style="display:block; font-size:12px; font-weight:500; color:#475467; margin-bottom:4px;">Durée (heures)</label>
        <input type="number" value="7" style="width:120px; height:48px; text-align:center; border:1px solid #d0d5dd; border-radius:10px; font-size:16px; color:#101828; background:#f9fafb;">
      </div>
    </div>

    <p style="font-size:12px; color:#667085; margin:12px 0 0;">Durée en heures, par pas de 0,25 (ex. 1,5 pour 1h30).</p>
  </div>

  <div style="flex-shrink:0; background:#fff; border-top:1px solid #e4e7ec; padding:12px 16px;">
    <button type="button" style="width:100%; min-height:48px; border:none; border-radius:10px; background:#465fff; color:#fff; font-weight:600; cursor:pointer;">Enregistrer la journée</button>
  </div>

</div>
</x-dc>
</body>
</html>
