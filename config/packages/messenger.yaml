framework:
    messenger:
        # Les échecs définitifs (après épuisement des tentatives) sont isolés pour analyse (US-060, ADR-0007).
        failure_transport: failed

        transports:
            # Traitement asynchrone hors requête HTTP (US-060 : valorisation ≤ 15 min).
            # Transport Doctrine (ADR-0007) : durable, rejouable, cohérent avec l'hôte managé.
            # auto_setup=0 : la table est versionnée par migration (jamais de DDL implicite en prod).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    # Retry borné (ENF-PERF-5 / résilience) : 3 tentatives, backoff exponentiel.
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0

            # Messages en échec définitif, conservés pour inspection (messenger:failed:show).
            failed: 'doctrine://default?queue_name=failed'

            # Bus synchrone pour les messages non routés vers l'async.
            sync: 'sync://'

        buses:
            messenger.bus.default:
                middleware:
                    # ARC-47 / RSQ-15 : à la consommation, le contexte tenant est posé depuis le
                    # message puis effacé, sans état résiduel d'un message à l'autre (parité worker).
                    - App\Infrastructure\Messaging\TenantContextMiddleware

        routing:
            # US-060 : la valorisation des temps validés est traitée hors requête (≤ 15 min).
            'App\Application\Timesheet\Message\TimeEntriesValidated': async
            # US-060 CA-4 : le re-déclenchement à la définition d'un tarif est asynchrone (jamais
            # dans la requête HTTP — sinon le middleware tenant effacerait le contexte de la requête).
            'App\Application\Pricing\Message\ProfileRateDefined': async
            # US-060 T-060-06 : rematérialisation de fact_project_revenue après valorisation, hors requête.
            'App\Application\Analytics\Message\AnalyticsRebuildRequested': async
            # US-057 CA-1 : les calculs aval à la clôture d'une période sont traités hors requête.
            'App\Application\Period\Message\PeriodClosed': async
            # US-054 CA-1 : notifications d'absence (manager / demandeur) hors requête.
            'App\Application\Absence\Message\AbsenceDeclared': async
            'App\Application\Absence\Message\AbsenceDecided': async
            # US-056 T-056-03 : calcul + émission des relances hors requête (RLS armée par le
            # middleware à la consommation ; jamais sync — le contexte de la requête serait effacé).
            'App\Application\Reminder\Message\SendDueReminders': async

when@test:
    framework:
        messenger:
            transports:
                # En test, l'async est un transport in-memory (pas d'I/O Doctrine, consommation déterministe).
                async: 'in-memory://'
