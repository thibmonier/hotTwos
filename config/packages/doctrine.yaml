doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        # La table du transport Doctrine de Messenger (T-TECH-01) n'est pas une entité mappée :
        # on l'exclut de la gestion de schéma (diff / schema:validate) — elle est versionnée à part.
        schema_filter: ~^(?!messenger_messages$).*~

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Domain'
                prefix: 'App\Domain'
                alias: App
            # US-068 (T-068-05) — entité de persistance du reset-password-bundle, hors domaine
            # (couplée au vendor) : mappée depuis l'infrastructure pour garder le domaine pur.
            Security:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Security'
                prefix: 'App\Infrastructure\Security'
                alias: Security
        # Isolation multi-tenant (ARC-33) — activé par requête via TenantFilterConfigurator (ARC-61).
        filters:
            tenant:
                class: App\Infrastructure\Persistence\Doctrine\Filter\TenantFilter
                enabled: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
