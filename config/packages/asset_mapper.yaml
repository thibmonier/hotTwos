framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        # Le path des contrôleurs Stimulus du bundle tailsfadmin doit être déclaré
        # côté hôte (le prepend() du bundle ne survit pas au merge Flex — cf. README §1).
        paths:
            'assets/': ''
            'vendor/tailsfadmin/tailsfadmin-bundle/assets/controllers': 'bundles/tailsfadmin'
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
