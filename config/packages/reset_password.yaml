symfonycasts_reset_password:
    request_password_repository: App\Infrastructure\Security\ResetPassword\DoctrineResetPasswordRequestRepository
    # Durée de vie du lien de réinitialisation (US-068) : 1 heure.
    lifetime: 3600
    # Délai minimal entre deux demandes pour un même compte (anti-abus) : 1 heure.
    throttle_limit: 3600
