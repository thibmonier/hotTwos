security:
    # Hachage des mots de passe : Argon2id explicite (ENF-SEC-3 / rules/11-security) —
    # jamais bcrypt/MD5/SHA1. `sodium` = Argon2id via libsodium.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium

    # L'utilisateur est chargé depuis la base (isolé par tenant via le filtre — US-001).
    providers:
        app_users:
            entity:
                class: App\Domain\User\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            # Authenticator (login) à ajouter dans la tranche suivante d'US-002.

    access_control: []

when@test:
    security:
        password_hashers:
            # Coût réduit en test (l'algorithme reste Argon2id).
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: sodium
                memory_cost: 10240
                time_cost: 3
