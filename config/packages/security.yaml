security:
    # Hachage des mots de passe : Argon2id explicite (ENF-SEC-3 / rules/11-security) —
    # jamais bcrypt/MD5/SHA1. `sodium` = Argon2id via libsodium.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium

    # L'utilisateur est chargé depuis la base (isolé par tenant via le filtre — US-001).
    providers:
        app_users:
            entity:
                class: App\Domain\User\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # API : authentification JSON. Sans point d'entrée web → 401 pour les non-authentifiés (US-002).
        api:
            pattern: ^/api
            lazy: true
            provider: app_users
            # Contexte de session partagé avec le pare-feu web : une session vaut pour l'API et le web
            # (comportement historique du pare-feu unique) ; seuls les points d'entrée diffèrent (401 vs /login).
            context: main
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            logout:
                path: api_logout
        # Web : authentification par formulaire, redirection vers /login pour les non-authentifiés (US-068).
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: home
            logout:
                path: app_logout
                target: login
                enable_csrf: true

    access_control:
        # /api/me exige un utilisateur authentifié (dont le tenant est alors résolu).
        - { path: ^/api/me, roles: ROLE_USER }
        # Sonde d'habilitation US-003 : authentification requise ; le contrôle fin
        # (permission + périmètre) est fait dans la couche applicative (ARC-19).
        - { path: ^/api/_probe, roles: ROLE_USER }
        # Saisie de temps US-050 : un collaborateur authentifié saisit pour lui-même.
        - { path: ^/api/time-entries, roles: ROLE_USER }
        - { path: ^/saisie, roles: ROLE_USER }
        # Validation des temps US-055 : le contrôle fin (permission + périmètre) est applicatif.
        - { path: ^/validation, roles: ROLE_USER }
        # Organisation US-010 : authentification requise ; l'habilitation ADMIN (MANAGE_ORGANIZATION)
        # est vérifiée dans la couche applicative (ARC-19).
        - { path: ^/api/org-units, roles: ROLE_USER }
        - { path: ^/api/org-memberships, roles: ROLE_USER }
        - { path: ^/organisation, roles: ROLE_USER }
        # Tarification US-011 : authentification requise ; habilitation ADMIN (MANAGE_PRICING) en applicatif.
        - { path: ^/api/profiles, roles: ROLE_USER }
        - { path: ^/api/profile-rates, roles: ROLE_USER }
        - { path: ^/profils, roles: ROLE_USER }
        # Valorisation US-060 : recalcul manuel authentifié ; l'habilitation RECOMPUTE_VALUATION
        # (et le verrou de période clôturée) sont vérifiés dans la couche applicative (ARC-19).
        - { path: ^/api/valorisation, roles: ROLE_USER }
        # Dashboard financier US-060 : authentifié ; habilitation VIEW_PROJECT_FINANCIALS (et le
        # gating du coût sensible) portés par la couche applicative (ARC-19).
        - { path: ^/valorisation, roles: ROLE_USER }
        # Administration des périodes US-057 : authentifié ; habilitation MANAGE_PERIODS applicative.
        - { path: ^/administration/periodes, roles: ROLE_USER }
        # Absences US-054 : authentifié ; l'habilitation de décision (VALIDATE_ABSENCE) est applicative.
        - { path: ^/api/absences, roles: ROLE_USER }
        - { path: ^/absences, roles: ROLE_USER }
        # Complétude US-058 : authentifié ; le périmètre équipe (VIEW_TEAM_COMPLETENESS) est applicatif.
        - { path: ^/api/completude, roles: ROLE_USER }
        - { path: ^/completude, roles: ROLE_USER }
        # Relances US-056 : authentifié ; l'habilitation de paramétrage (MANAGE_REMINDERS) est
        # applicative. L'opt-out individuel (^/api/me/reminder-preference) relève déjà de ^/api/me.
        - { path: ^/api/reminders, roles: ROLE_USER }
        - { path: ^/relances, roles: ROLE_USER }
        # Synthèse d'activité US-059 : authentifié ; le cloisonnement strict au collaborateur courant
        # (403 sur un autre user_id) est porté par la couche applicative (ARC-19).
        - { path: ^/api/activity-summary, roles: ROLE_USER }
        # Projets US-030+ : authentifié ; les habilitations (VIEW/CREATE/EDIT_PROJECT) sont applicatives.
        - { path: ^/projets, roles: ROLE_USER }
        # Mon compte US-067/US-068 : l'utilisateur gère son propre profil et mot de passe.
        - { path: ^/mon-compte, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Coût réduit en test (l'algorithme reste Argon2id).
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: sodium
                memory_cost: 10240
                time_cost: 3
