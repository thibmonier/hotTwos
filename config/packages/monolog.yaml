monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Canal d'audit de sécurité dédié (US-003, HAB-6, ARC-75) : piste séparée et
        # toujours émise (jamais soumise à fingers_crossed, qui n'écrirait qu'en cas d'erreur).
        - security

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!security"]
            security:
                type: stream
                path: "%kernel.logs_dir%/security.log"
                level: info
                channels: [security]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!security"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            security:
                type: stream
                path: "%kernel.logs_dir%/security-%kernel.environment%.log"
                level: info
                channels: [security]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!security"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # Audit de sécurité : flux dédié JSON, niveau info, jamais bufferisé (HAB-6).
            security:
                type: stream
                path: php://stderr
                level: info
                channels: [security]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
