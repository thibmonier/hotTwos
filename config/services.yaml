# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # US-006 / ARC-47 (RSQ-15) — le contexte de tenant porté par requête est réinitialisé
    # à chaque frontière de requête (worker FrankenPHP) : aucune fuite d'état d'une requête
    # à l'autre. Le tag `kernel.reset` fait appeler clear() par Symfony entre deux requêtes.
    App\Infrastructure\Tenant\RequestTenantContext:
        tags:
            - { name: kernel.reset, method: clear }

    # Exposé pour le bridge worker FrankenPHP (public/index.php) : réinitialise les
    # services taggés kernel.reset entre deux requêtes servies par le même worker.
    app.services_resetter:
        alias: services_resetter
        public: true

    # Ports d'autorisation (US-003, DIP/ARC-18) : l'interface du domaine résout vers
    # l'implémentation d'infrastructure.
    App\Domain\Authorization\RoleRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineRoleRepository'
    App\Domain\Authorization\SecurityAuditLogger: '@App\Infrastructure\Authorization\MonologSecurityAuditLogger'

    # Ports analytiques (US-005, ADR-9) : flux d'événements et projecteur.
    App\Domain\Analytics\EventStore: '@App\Infrastructure\Persistence\Doctrine\DoctrineEventStore'
    App\Domain\Analytics\AnalyticsProjector: '@App\Infrastructure\Analytics\DoctrineAnalyticsProjector'
    App\Domain\Analytics\DivergenceChecker: '@App\Infrastructure\Analytics\SqlDivergenceChecker'
    App\Domain\Analytics\AnalyticsSchemaGuard: '@App\Infrastructure\Analytics\AnalyticsSchemaHardener'

    # Observabilité (US-008) : le registre de métriques est un singleton persistant entre
    # requêtes worker (NON taggé kernel.reset) pour agréger l'histogramme des latences.
    App\Application\Observability\MetricsRegistry: '@App\Infrastructure\Observability\MetricsCollector'

    # Ports de saisie de temps (US-050, DIP).
    App\Domain\Project\ProjectRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineProjectRepository'
    App\Domain\Timesheet\TimeEntryRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineTimeEntryRepository'

    # Port utilisateur (lecture, US-010 — validation d'appartenance tenant).
    App\Domain\User\UserRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineUserRepository'

    # Ports organisation (US-010, DIP).
    App\Domain\Organization\OrgUnitRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineOrgUnitRepository'
    App\Domain\Organization\OrgMembershipRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineOrgMembershipRepository'

    # Ports tarification (US-011, DIP).
    App\Domain\Pricing\ProfileRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineProfileRepository'
    App\Domain\Pricing\ProfileRateRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineProfileRateRepository'
