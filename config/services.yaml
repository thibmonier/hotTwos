# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # US-060 / CA-5 — périodes comptables clôturées (mois `YYYY-MM`), en attendant US-057.
    # Stub par configuration : vide = aucune clôture. Surchargeable en test/déploiement.
    valuation.closed_periods: []
    # US-054 — droit annuel d'absences acquis par collaborateur (accrual simplifié, paramétrable).
    absence.acquired_days: 25.0

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # US-006 / ARC-47 (RSQ-15) — le contexte de tenant porté par requête est réinitialisé
    # à chaque frontière de requête (worker FrankenPHP) : aucune fuite d'état d'une requête
    # à l'autre. Le tag `kernel.reset` fait appeler clear() par Symfony entre deux requêtes.
    App\Infrastructure\Tenant\RequestTenantContext:
        tags:
            - { name: kernel.reset, method: clear }

    # Exposé pour le bridge worker FrankenPHP (public/index.php) : réinitialise les
    # services taggés kernel.reset entre deux requêtes servies par le même worker.
    app.services_resetter:
        alias: services_resetter
        public: true

    # Ports d'autorisation (US-003, DIP/ARC-18) : l'interface du domaine résout vers
    # l'implémentation d'infrastructure.
    App\Domain\Authorization\RoleRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineRoleRepository'
    App\Domain\Authorization\SecurityAuditLogger: '@App\Infrastructure\Authorization\MonologSecurityAuditLogger'

    # Ports analytiques (US-005, ADR-9) : flux d'événements et projecteur.
    App\Domain\Analytics\EventStore: '@App\Infrastructure\Persistence\Doctrine\DoctrineEventStore'
    App\Domain\Analytics\AnalyticsProjector: '@App\Infrastructure\Analytics\DoctrineAnalyticsProjector'
    App\Domain\Analytics\DivergenceChecker: '@App\Infrastructure\Analytics\SqlDivergenceChecker'
    App\Domain\Analytics\AnalyticsSchemaGuard: '@App\Infrastructure\Analytics\AnalyticsSchemaHardener'

    # Observabilité (US-008) : le registre de métriques est un singleton persistant entre
    # requêtes worker (NON taggé kernel.reset) pour agréger l'histogramme des latences.
    App\Application\Observability\MetricsRegistry: '@App\Infrastructure\Observability\MetricsCollector'

    # Ports de saisie de temps (US-050, DIP).
    App\Domain\Project\ProjectRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineProjectRepository'
    App\Domain\Timesheet\TimeEntryRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineTimeEntryRepository'

    # Port utilisateur (lecture, US-010 — validation d'appartenance tenant).
    App\Domain\User\UserRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineUserRepository'

    # Ports organisation (US-010, DIP).
    App\Domain\Organization\OrgUnitRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineOrgUnitRepository'
    App\Domain\Organization\OrgMembershipRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineOrgMembershipRepository'

    # Ports tarification (US-011, DIP).
    App\Domain\Pricing\ProfileRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineProfileRepository'
    App\Domain\Pricing\ProfileRateRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineProfileRateRepository'
    App\Domain\Pricing\ProfileAssignmentRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineProfileAssignmentRepository'

    # Port valorisation (US-060, DIP).
    App\Domain\Valuation\TimeEntryValuationRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineTimeEntryValuationRepository'

    # Statut de clôture de période (US-060 CA-5) : clôture **réelle** par tenant (US-057, T-057-03),
    # branchée sur l'agrégat AccountingPeriod. Le stub ConfiguredPeriodClosure reste défini
    # (utilisable en test / configuration) mais n'est plus l'implémentation de production.
    App\Domain\Valuation\PeriodClosureStatus: '@App\Infrastructure\Valuation\DoctrinePeriodClosure'
    App\Infrastructure\Valuation\ConfiguredPeriodClosure:
        arguments:
            $closedPeriods: '%valuation.closed_periods%'

    # Ports périodes comptables et réouvertures (US-057, DIP).
    App\Domain\Period\AccountingPeriodRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineAccountingPeriodRepository'
    App\Domain\Period\ReopeningRequestRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineReopeningRequestRepository'

    # Ports absences (US-054, DIP).
    App\Domain\Absence\AbsenceTypeRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineAbsenceTypeRepository'
    App\Domain\Absence\AbsenceRequestRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineAbsenceRequestRepository'
    App\Application\Absence\AbsenceBalance:
        arguments:
            $acquiredDays: '%absence.acquired_days%'

    # Ports relances (US-056, DIP).
    App\Domain\Reminder\ReminderRuleRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineReminderRuleRepository'
    App\Domain\Reminder\ReminderPreferenceRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineReminderPreferenceRepository'
    App\Domain\Reminder\ReminderLogRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineReminderLogRepository'
